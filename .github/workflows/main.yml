name: CI/CD Pipeline 구축

on:
  push:
    branches: [ develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPO_NAME: ${{ secrets.AR_REPO_NAME }}
  IMAGE_REPO: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO_NAME }}/cobee-server
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Push Docker Image
        run: |
          echo "${{ secrets.FIREBASE_ADMINSDK_JSON }}" > firebase-adminsdk.json
          docker build -t "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" .
          docker push "${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}"


      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: cobee-server
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          flags: >
            --add-cloudsql-instances=cobee-d675e:asia-northeast3:cobee-postgre
            --timeout=300
            --service-account=${{ secrets.CLOUD_RUN_RUNTIME_SA }}
          env_vars: |
            SPRING_DATASOURCE_URL=jdbc:postgresql:///cobee-postgre?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=cobee-d675e:asia-northeast3:cobee-postgre&sslmode=disable
            SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            SPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }}
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            OCR_API_URL=${{ secrets.OCR_API_URL }}
            
